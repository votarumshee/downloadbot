[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "downloadbot"
version = "0.1.0"
description = "Authenticated asynchronous video download API and Telegram adapter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "python-dotenv>=1.2,<2",
  "psycopg[binary]>=3.2,<4",
  "yt-dlp[default]>=2025.10.22",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
downloadbot = "downloadbot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
