# Optional: also apply compose.yaml + deploy/compose.vds.yaml.
services:
  telegram:
    build: .
    command: [python, -m, downloadbot.telegram_bot]
    env_file: /etc/downloadbot/telegram.env
    depends_on:
      api: {condition: service_healthy}
      db: {condition: service_healthy}
    read_only: true
    # Up to four concurrent uploads, each capped at 50 MB.
    tmpfs: ["/tmp:mode=1777,size=256m"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
