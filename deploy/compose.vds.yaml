# Apply together with compose.yaml and /etc/downloadbot/deployment.env.
services:
  db:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging: *bounded_logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 30s
  worker:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging: *bounded_logs
    healthcheck:
      test: [CMD, python, -c, "from downloadbot.config import Settings; from downloadbot.store import Store; raise SystemExit(0 if Store(Settings()).ready() else 1)"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
